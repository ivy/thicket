  <text x="437" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8ba394">speaking</text>

  <rect x="610" y="182" width="253" height="210" rx="13" fill="#141b17" stroke="#243029" />
  <text x="628" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2.4" fill="#8ba394">CLAUDE CODE</text>
  <text x="628" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e9efe9"><tspan fill="#d9a441">›</tspan> have atlas patch it</text>
  
    <text x="628" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#67a97e">✓</text>
    <text x="644" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8ba394">14 updates applied</text>
  
    <text x="628" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#67a97e">✓</text>
    <text x="644" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8ba394">services verified</text>
  
    <text x="628" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#d9a441">●</text>
    <text x="644" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8ba394">awaiting approval</text>
  <text x="628" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8ba394">same agent, same memory</text>

  <rect x="883" y="182" width="253" height="210" rx="13" fill="none" stroke="#8ba394" stroke-dasharray="5 5" opacity="0.6"/>
  <text x="901" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2.4" fill="#8ba394">NEXT</text>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8ba394">
    <text x="901" y="254">GitHub events. A webhook.</text>
    <text x="901" y="274">A shell script. Each one is</text>
    <text x="901" y="294">a bridge, and a bridge only</text>
    <text x="901" y="314">translates.</text>
  </g>

