<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-label="thicket — an agent on every system you operate, reached from Slack, a phone call, Claude Code, or the next bridge you write">
  <rect width="1200" height="590" fill="#0d1210"/>

  <text x="62" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="66" font-weight="700" letter-spacing="-3" fill="#e9efe9">thicket</text>
  <text x="1136" y="90" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8ba394">message passing is the universal interface</text>
  <text x="66" y="134" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#e9efe9">An agent on every system you operate — reachable from wherever you already are.</text>
  <path d="M64,158 H1136" stroke="#243029" stroke-width="1"/>

  <rect x="64" y="182" width="253" height="210" rx="13" fill="#141b17" stroke="#243029" />
  <text x="82" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2.4" fill="#8ba394">SLACK</text>
  <text x="82" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#e9efe9">ivy</text>
  <text x="82" y="268" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#e9efe9"><tspan fill="#d9a441">@atlas</tspan> patch the server</text>
  <text x="82" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#e9efe9">atlas</text>
  <rect x="132" y="289" width="30" height="14" rx="3" fill="#1a221d" stroke="#243029"/>
  <text x="147" y="299" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" letter-spacing="0.6" fill="#8ba394">APP</text>
  <text x="82" y="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#e9efe9">14 updates. libc6 needs</text>
  <text x="82" y="338" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#e9efe9">a reboot.</text>
  <rect x="82" y="354" width="130" height="28" rx="6" fill="none" stroke="#d9a441" stroke-width="1.4"/>
  <text x="147" y="372" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#d9a441">Reboot at 03:00</text>

  <rect x="337" y="182" width="253" height="210" rx="13" fill="#141b17" stroke="#243029" />
  <text x="355" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2.4" fill="#8ba394">PHONE</text>
  <text x="355" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8ba394"><tspan fill="#67a97e">PIN ✓</tspan> · connected</text>
  <text x="355" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#e9efe9">you</text>
  <text x="355" y="292" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#e9efe9">how did the backup go?</text>
  <text x="355" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#e9efe9">atlas</text>
  <text x="355" y="344" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#e9efe9">Snapshot at 3:02 —</text>
  <text x="355" y="362" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#e9efe9">41 GB, clean.</text>
