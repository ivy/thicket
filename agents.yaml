# Roster of thicket agents. Source of truth for identity, Slack apps, and
# tailnet provisioning. Schema: packages/roster/src/schema.ts.
agents:
  example:
    host: thicket-host
    user: thicket-example
    description: Example agent used to exercise the toolchain.
    tag: tag:thicket-example
    # Required: who may open a turn as this agent's unix account. There is
    # no default — an agent nobody declared a reach for will not start.
    # `anyone` means every member of the Slack workspace; a list means only
    # those people, on every surface. `thicket doctor` says which it is.
    reach:
      operators: anyone
      # operators: [U0123ABCDEF]  # only these people
      # channels: listed          # and only the channels named below
    harness:
      type: claude-agent-sdk
      cwd: /home/thicket-example
      model: claude-sonnet-5
    # A project channel means a working directory: a mention in #proj-example
    # runs in that checkout, with its CLAUDE.md, skills, and memory. The
    # bridge only ever sees the name; the path stays on the agent's host.
    workspaces:
      example: /home/thicket-example/src/example
    channels:
      "#proj-example": example
