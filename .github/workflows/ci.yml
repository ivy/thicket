name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  # The deploy artifacts are only ever exercised on a systemd host, and the
  # developers' machines are Macs. Seconds of work, so it runs every time
  # rather than behind a paths: filter.
  deploy:
    uses: ./.github/workflows/deploy-check.yml

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3

      # Online, so the checks that ask GitHub about each pinned action can
      # reach its API.
      - run: jactionlint --online
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
