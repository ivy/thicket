name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  # The deploy artifacts are only ever exercised on a systemd host, and the
  # developers' machines are Macs. Seconds of work, so it runs every time
  # rather than behind a paths: filter.
  deploy:
    uses: ./.github/workflows/deploy-check.yml

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3

      - run: actionlint

      # Online, so the unpinned-uses and known-vulnerable-actions audits can
      # reach the GitHub API.
      - run: zizmor .github/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pinact run --check
