# The gate, on its own so a tag runs exactly what a push runs. Called by
# ci.yml on every push and pull request, and by release.yml before it builds
# anything: a tag should never be where red is discovered.
name: gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The root contract from AGENTS.md, in order.
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint

      - run: pnpm build:netd
      - run: go test ./netd/...

      # Cross-compiles both fleet platforms. The release pipeline ships what
      # this proves buildable, so a broken compile should not reach a tag.
      - run: pnpm compile --all
