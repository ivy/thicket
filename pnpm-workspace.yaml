packages:
  - packages/*
  - apps/*
  - tests/*

# A published package has to sit for a week before this repo will install it.
#
# The dependency tree is compiled into the release binaries, so the window
# this closes is lockfile advancement: a poisoned upstream release picked up
# by a bump. Most npm compromises are found and pulled within days of being
# published, and waiting costs nothing that matters — a fix urgent enough to
# need the current hour can be pinned by hand with a reason.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Renovate security update: @modelcontextprotocol/sdk@1.31.0
  - "@modelcontextprotocol/sdk@1.31.0"
  # CVE-2026-111943: 0.3.303 bundles Claude Code 2.1.303, the first to distrust
  # the compromised eMudhra intermediates. The platform packages carry the binary.
  - "@anthropic-ai/claude-agent-sdk@0.3.303"
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.303"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.303"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.303"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.303"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.303"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.303"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.303"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.303"
  # Renovate security update: zod@4.6.6
  - zod@4.6.6
